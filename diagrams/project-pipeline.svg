<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" role="img" aria-labelledby="cadre-title cadre-desc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="cadre-title">Cadre setup and project flow</title>
  <desc id="cadre-desc">The operator configures Cadre with the main agent and a separate Cadre Wizard. For each project outcome, one accountable owner, normally the project manager, coordinates persistent worker seats, checks evidence against acceptance points, and hands the result back to the operator. Requirements and design specialists contribute when useful. Independent review is added when risk or acceptance criteria warrant it. The project plan remains canonical; Kanban and Gantt may be generated views, and FlowBoard may mirror operational status. Support roles are available as needed. New products or material scope changes create a new outcome and revisit requirements when needed.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1240" height="880" fill="#f8fafc"/>
  <text x="40" y="46" font-size="26" font-weight="750" fill="#0f172a">How Cadre works</text>
  <text x="40" y="73" font-size="14" fill="#64748b">Configure the team once. Then coordinate each outcome around one accountable owner.</text>

  <text x="40" y="108" font-size="11" font-weight="750" fill="#94a3b8" letter-spacing="1.5">TEAM SETUP</text>
  <rect x="40" y="123" width="220" height="80" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="150" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#1e1b4b">Operator</text>
  <text x="150" y="178" text-anchor="middle" font-size="12" fill="#3730a3">chooses whether to set up Cadre</text>

  <path d="M 263 163 L 322 163" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <text x="292" y="151" text-anchor="middle" font-size="10.5" fill="#64748b">asks</text>

  <rect x="326" y="123" width="235" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="443.5" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#172554">OpenClaw main agent</text>
  <text x="443.5" y="178" text-anchor="middle" font-size="12" fill="#1e40af">explains the install and gets consent</text>

  <path d="M 564 163 L 623 163" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <text x="593" y="151" text-anchor="middle" font-size="10.5" fill="#64748b">spawns</text>

  <rect x="627" y="123" width="270" height="80" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="762" y="153" text-anchor="middle" font-size="15" font-weight="700" fill="#3b0764">Cadre Wizard</text>
  <text x="762" y="174" text-anchor="middle" font-size="12" fill="#6d28d9">interviews, writes confirmed choices, verifies</text>
  <text x="762" y="191" text-anchor="middle" font-size="10.5" font-style="italic" fill="#7c3aed">stays available for future updates</text>

  <path d="M 900 163 L 959 163" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>

  <rect x="963" y="123" width="237" height="80" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="1081.5" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Cadre team</text>
  <text x="1081.5" y="178" text-anchor="middle" font-size="12" fill="#166534">roles and workspaces selected by you</text>

  <text x="40" y="255" font-size="11" font-weight="750" fill="#94a3b8" letter-spacing="1.5">PROJECT WORK</text>

  <rect x="35" y="280" width="190" height="112" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="130" y="316" text-anchor="middle" font-size="15" font-weight="700" fill="#1e1b4b">Operator entry</text>
  <text x="130" y="340" text-anchor="middle" font-size="12" fill="#3730a3">configured chat route</text>
  <text x="130" y="362" text-anchor="middle" font-size="11" fill="#4338ca">or direct PM contact</text>

  <path d="M 228 336 L 271 336" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <text x="249" y="323" text-anchor="middle" font-size="10.5" fill="#64748b">request</text>

  <rect x="275" y="280" width="210" height="112" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
  <text x="380" y="313" text-anchor="middle" font-size="15" font-weight="700" fill="#172554">Project Manager</text>
  <text x="380" y="334" text-anchor="middle" font-size="11.5" font-weight="650" fill="#1d4ed8">accountable outcome owner</text>
  <text x="380" y="358" text-anchor="middle" font-size="11" fill="#1e40af">one canonical task and acceptance record</text>
  <text x="380" y="377" text-anchor="middle" font-size="10.5" fill="#1e40af">plan · coordinate · hand off</text>

  <path d="M 488 336 L 531 336" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <text x="509" y="323" text-anchor="middle" font-size="10.5" fill="#64748b">bounded work</text>

  <rect x="535" y="280" width="200" height="112" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="635" y="313" text-anchor="middle" font-size="14.5" font-weight="700" fill="#172554">Persistent worker seats</text>
  <text x="635" y="337" text-anchor="middle" font-size="11.5" fill="#1e40af">implement within the PM's scope</text>
  <text x="635" y="360" text-anchor="middle" font-size="11.5" fill="#1e40af">self-check and return evidence</text>
  <text x="635" y="378" text-anchor="middle" font-size="10.5" fill="#1e40af">not disposable subagent runs</text>

  <path d="M 738 336 L 781 336" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <text x="759" y="323" text-anchor="middle" font-size="10.5" fill="#64748b">result + evidence</text>

  <rect x="785" y="280" width="205" height="112" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="887.5" y="313" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3b0764">Owner checks result</text>
  <text x="887.5" y="338" text-anchor="middle" font-size="11.5" fill="#6d28d9">against acceptance points</text>
  <text x="887.5" y="361" text-anchor="middle" font-size="11.5" fill="#6d28d9">fix, replan, or hand off</text>
  <text x="887.5" y="379" text-anchor="middle" font-size="10.5" fill="#7c3aed">independent review as warranted</text>

  <path d="M 993 336 L 1031 336" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow-slate)"/>

  <rect x="1035" y="280" width="180" height="112" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="1125" y="314" text-anchor="middle" font-size="14.5" font-weight="700" fill="#14532d">Operator handoff</text>
  <text x="1125" y="340" text-anchor="middle" font-size="11.5" fill="#166534">result · evidence</text>
  <text x="1125" y="362" text-anchor="middle" font-size="11.5" fill="#166534">open decisions · next step</text>

  <path d="M 380 394 L 380 421 L 230 421 L 230 465" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/>

  <path d="M 887 394 L 887 431 L 620 431 L 620 465" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-violet)"/>

  <rect x="45" y="470" width="370" height="106" rx="11" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="230" y="501" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Requirements and design</text>
  <text x="230" y="525" text-anchor="middle" font-size="11.5" fill="#1d4ed8">RA and PD clarify scope or architecture</text>
  <text x="230" y="547" text-anchor="middle" font-size="11.5" fill="#1d4ed8">as needed—not a required approval stop</text>

  <rect x="435" y="470" width="370" height="106" rx="11" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="620" y="501" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Independent QA / review</text>
  <text x="620" y="525" text-anchor="middle" font-size="11.5" fill="#6d28d9">reviewer is distinct from the builder</text>
  <text x="620" y="547" text-anchor="middle" font-size="11.5" fill="#6d28d9">when risk or criteria warrant it</text>

  <rect x="825" y="470" width="390" height="106" rx="11" fill="#ecfdf5" stroke="#4ade80" stroke-width="1.8"/>
  <text x="1020" y="501" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Plan and tracking views</text>
  <text x="1020" y="525" text-anchor="middle" font-size="11.5" fill="#15803d">one canonical plan → Kanban and Gantt views</text>
  <text x="1020" y="547" text-anchor="middle" font-size="11.5" fill="#15803d">FlowBoard mirrors status unless deliberately migrated</text>

  <path d="M 1125 394 L 1125 610 L 230 610 L 230 582" fill="none" stroke="#b91c1c" stroke-width="2.1" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
  <rect x="427" y="591" width="500" height="34" rx="8" fill="#f8fafc"/>
  <text x="677" y="613" text-anchor="middle" font-size="11.5" font-weight="650" fill="#b91c1c">New product or material scope change → new outcome; revisit requirements as needed</text>

  <rect x="40" y="666" width="1160" height="145" rx="13" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="64" y="695" font-size="14" font-weight="700" fill="#0f172a">Support roles — on call as needed</text>
  <text x="64" y="716" font-size="11.5" fill="#64748b">They support the owner without becoming mandatory stops in every project's flow.</text>

  <rect x="64" y="738" width="205" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="166.5" y="760" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Security / IT</text>
  <text x="166.5" y="778" text-anchor="middle" font-size="10.5" fill="#64748b">risk and operations</text>
  <rect x="289" y="738" width="205" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="391.5" y="760" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Consultant</text>
  <text x="391.5" y="778" text-anchor="middle" font-size="10.5" fill="#64748b">second opinion</text>
  <rect x="514" y="738" width="205" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="616.5" y="760" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Social Media Manager</text>
  <text x="616.5" y="778" text-anchor="middle" font-size="10.5" fill="#64748b">external communications</text>
  <rect x="739" y="738" width="205" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="841.5" y="760" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Finance Manager</text>
  <text x="841.5" y="778" text-anchor="middle" font-size="10.5" fill="#64748b">budget reporting</text>
  <rect x="964" y="738" width="205" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1066.5" y="760" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Agent Resources</text>
  <text x="1066.5" y="778" text-anchor="middle" font-size="10.5" fill="#64748b">roster and onboarding</text>

  <text x="40" y="846" font-size="12" fill="#475569">One owner. Useful specialists. Evidence tied to the exact result. Project-specific rules stay with the tenant.</text>
</svg>
