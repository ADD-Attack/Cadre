<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" width="1160" height="720" role="img" aria-labelledby="fig6-title fig6-desc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="fig6-title">The Cadre project pipeline: wizard once, then Requirements Analyst, Project Designer, Project Manager with its workers, QA verifier, finished product — with support roles on call</title>
  <desc id="fig6-desc">A left-to-right flow diagram. At the top left, a human operator connects through one chat channel to a wizard, which runs once at install to confirm roles and budgets. A connector carries the flow down into the project pipeline, a horizontal chain of four stations followed by a result. Station one is the Requirements Analyst: intake, clarification and scope. Station two is the Project Designer: architecture and approach. Station three is the Project Manager, which plans and dispatches and holds the workers in its scope. Station four is the QA verifier, an independent check that returns evidence. The chain ends in the finished, shipped product. A dashed red rework path runs from the finished product all the way back to the Requirements Analyst, labelled: a new product, or a scope change or new feature, either way goes back to the Requirements Analyst. Along the bottom, a dashed panel lists support roles on call as needed: Security/IT, Consultant, Social Media Manager, Finance Manager and Agent Resources. A footer states that every project enters the same way, nothing skips the Requirements Analyst, and a new product or a scope change is a new pass through the pipeline rather than an edit to work already in flight.</desc>
  <defs>
    <marker id="p-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="p-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="720" fill="#f8fafc"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#0f172a">How a project runs</text>
  <text x="40" y="72" font-size="14" fill="#64748b">One wizard at setup. Then a fixed path &#8212; with support roles on call beside it.</text>

  <!-- ===== entry: operator -> wizard ===== -->
  <rect x="60" y="104" width="200" height="72" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2.5"/>
  <text x="80" y="134" font-size="15" font-weight="700" fill="#1e1b4b">Human operator</text>
  <text x="80" y="157" font-size="12" fill="#3730a3">one chat channel</text>

  <path d="M 262 140 L 304 140" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#p-arrow)"/>
  <text x="283" y="130" font-size="10.5" fill="#64748b" text-anchor="middle">once</text>

  <rect x="308" y="104" width="250" height="72" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="328" y="132" font-size="15" font-weight="700" fill="#3b0764">&#129497; Wizard</text>
  <text x="328" y="153" font-size="12" fill="#6d28d9">runs once, at install</text>
  <text x="328" y="169" font-size="11" font-style="italic" fill="#8b5cf6">roles + budgets confirmed</text>

  <!-- wizard -> pipeline start -->
  <path d="M 433 176 L 433 208 L 155 208 L 155 258" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#p-arrow)"/>
  <text x="200" y="232" font-size="11" fill="#64748b">team configured once &#8212; then the pipeline takes over</text>

  <!-- ===== pipeline row ===== -->
  <text x="60" y="252" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="0.08em">PROJECT PIPELINE</text>

  <rect x="60" y="262" width="190" height="88" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="155" y="294" font-size="14.5" font-weight="700" fill="#172554" text-anchor="middle">Requirements</text>
  <text x="155" y="312" font-size="14.5" font-weight="700" fill="#172554" text-anchor="middle">Analyst</text>
  <text x="155" y="334" font-size="11.5" fill="#1e40af" text-anchor="middle">intake &#183; clarify &#183; scope</text>

  <path d="M 252 306 L 278 306" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#p-arrow)"/>

  <rect x="280" y="262" width="190" height="88" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="375" y="294" font-size="14.5" font-weight="700" fill="#172554" text-anchor="middle">Project Designer</text>
  <text x="375" y="316" font-size="11.5" fill="#1e40af" text-anchor="middle">architecture &#183; approach</text>
  <text x="375" y="334" font-size="11.5" fill="#1e40af" text-anchor="middle">specifications</text>

  <path d="M 472 306 L 498 306" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#p-arrow)"/>

  <rect x="500" y="262" width="190" height="88" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="595" y="290" font-size="14.5" font-weight="700" fill="#172554" text-anchor="middle">Project Manager</text>
  <text x="595" y="308" font-size="11.5" fill="#1e40af" text-anchor="middle">plans &#183; dispatches &#183; tracks</text>
  <rect x="518" y="318" width="154" height="24" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="595" y="335" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">workers in its scope</text>

  <path d="M 692 306 L 718 306" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#p-arrow)"/>

  <rect x="720" y="262" width="190" height="88" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="815" y="294" font-size="14.5" font-weight="700" fill="#172554" text-anchor="middle">QA / Verifier</text>
  <text x="815" y="316" font-size="11.5" fill="#1e40af" text-anchor="middle">independent check</text>
  <text x="815" y="334" font-size="11.5" font-style="italic" fill="#3b82f6" text-anchor="middle">evidence before claims</text>

  <path d="M 912 306 L 938 306" fill="none" stroke="#475569" stroke-width="2.4" marker-end="url(#p-arrow)"/>

  <rect x="940" y="262" width="170" height="88" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="1025" y="298" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">Finished</text>
  <text x="1025" y="318" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">product</text>
  <text x="1025" y="338" font-size="11.5" fill="#166534" text-anchor="middle">shipped</text>

  <!-- ===== rework loop (from the finished product) ===== -->
  <path d="M 1025 350 L 1025 424 L 155 424 L 155 354" fill="none" stroke="#b91c1c" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#p-arrow-red)"/>
  <rect x="470" y="404" width="470" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="705" y="424" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="middle">New product, or scope change / new feature?</text>
  <text x="705" y="443" font-size="11.5" fill="#991b1b" text-anchor="middle">Either way &#8212; back to the Requirements Analyst.</text>

  <!-- ===== support roles ===== -->
  <rect x="60" y="486" width="1050" height="140" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="84" y="516" font-size="14" font-weight="700" fill="#0f172a">Support roles &#8212; on call as needed</text>
  <text x="84" y="536" font-size="11.5" fill="#64748b">Not stations in the flow. They attach to whichever project needs them, and go quiet when it doesn't.</text>

  <rect x="84" y="552" width="180" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="174" y="575" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">Security / IT</text>
  <text x="174" y="592" font-size="10.5" fill="#64748b" text-anchor="middle">advises, never edits</text>

  <rect x="282" y="552" width="180" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="372" y="575" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">Consultant</text>
  <text x="372" y="592" font-size="10.5" fill="#64748b" text-anchor="middle">second opinion</text>

  <rect x="480" y="552" width="180" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="570" y="575" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">Social Media Mgr</text>
  <text x="570" y="592" font-size="10.5" fill="#64748b" text-anchor="middle">outward comms</text>

  <rect x="678" y="552" width="180" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="768" y="575" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">Finance Manager</text>
  <text x="768" y="592" font-size="10.5" fill="#64748b" text-anchor="middle">budgets &#183; spend</text>

  <rect x="876" y="552" width="210" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="981" y="575" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">Agent Resources</text>
  <text x="981" y="592" font-size="10.5" fill="#64748b" text-anchor="middle">the roster itself</text>

  <!-- ===== footer ===== -->
  <text x="40" y="668" font-size="13" font-weight="600" fill="#334155">Every project enters the same way. Nothing skips the Requirements Analyst.</text>
  <text x="40" y="692" font-size="12" fill="#94a3b8">A new product, or a scope change, is a new pass through the pipeline &#8212; not an edit to work already in flight.</text>
</svg>
